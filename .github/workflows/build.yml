name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    # Готовый образ с Godot, шаблонами экспорта и Android SDK
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Подготовка шаблонов и ключа
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$PWD/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Настройка Godot для Android
        run: |
          SDK=""
          for d in /usr/lib/android-sdk "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /root/android-sdk; do
            if [ -n "$d" ] && [ -d "$d" ]; then SDK="$d"; break; fi
          done
          JAVA=$(dirname $(dirname $(readlink -f $(which javac))))
          echo "SDK=$SDK JAVA=$JAVA"
          ls "$SDK" || true
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          cat ~/.config/godot/editor_settings-4.3.tres

      - name: Импорт ресурсов и экспорт APK
        run: |
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$PWD/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          mkdir -p build
          godot --headless --import || true
          godot --headless --verbose --export-debug "Android" build/game.apk

      - uses: actions/upload-artifact@v4
        with:
          name: textrpg-apk
          path: build/game.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: textrpg-apk
          path: out

      - name: Публикация APK для прямого скачивания
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create latest out/game.apk --title "Последняя сборка" --notes "Автоматическая сборка" --target "$GITHUB_SHA" -R "$GITHUB_REPOSITORY"
